version: '3.8'

services:
  grapery-agent:
    # IMAGE / ENVIRONMENT 等由部署目录 .env 提供（CI 按 dev|prod 生成）
    image: ${IMAGE:-grapery-agent:dev}
    container_name: ${SERVICE_NAME:-grapery-agent}
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-9020}:9020"
    env_file:
      - .env
    # Agent access token（见 env.grapery-agent.*.example）：AGENT_TOKEN_VERIFY_KEY、
    # AGENT_ACCESS_TOKEN_REQUIRED、AGENT_TOKEN_REPLAY_CACHE_ENABLED、AGENT_EXEC_FRAGMENT_PANEL_ENABLED；
    # GRAPERY_API_KEY 需与 grapery 的 GRAPERY_INTERNAL_API_KEY 一致
    volumes:
      - ./data/agent-artifacts:/app/data/agent-artifacts
    networks:
      - grapery-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9020/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  grapery-network:
    external: true
